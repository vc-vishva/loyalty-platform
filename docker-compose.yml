# One-command local run: `docker compose up --build`
# Brings up PostgreSQL, the backend API (migrations auto-applied), and the
# frontend (nginx, proxying /v1 to the backend). No manual setup required.
#
# Frontend:  http://localhost:8080
# Backend:   http://localhost:3000/v1
services:
  db:
    image: postgres:16
    container_name: cowork-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cowork_booking
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: cowork-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cowork_booking?schema=public
      JWT_SECRET: change-me-in-production
      JWT_ACCESS_EXPIRATION_MINUTES: 15
      JWT_REFRESH_EXPIRATION_DAYS: 7
    ports:
      - '3000:3000'

  frontend:
    build: ./frontend
    container_name: cowork-frontend
    depends_on:
      - backend
    ports:
      - '8080:80'

volumes:
  pgdata:
